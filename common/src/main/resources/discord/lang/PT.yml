command-description:
  configure: "Configurar o Skoice."
  link: "Vincular sua conta do Discord ao Minecraft."
  unlink: "Desvincular sua conta do Discord do Minecraft."
  invite: "Obter o chat de voz por proximidade no seu servidor."
menu:
  invite-footer: "Quer o Skoice no seu servidor? Digite {invite-discord-command}!"
  review-footer: "Se divertindo com o Skoice? Considere [deixar uma avaliação no SpigotMC]({spigotmc-url})!"
  contributors-footer: "Skoice • carlodrift, Lucas_Cdry e colaboradores"
  configuration:
    title: "Configuração"
  server:
    title: "Servidor"
    description: "Para funcionar corretamente, o seu bot não pode estar presente em múltiplos servidores do Discord. Selecione o servidor onde você quer que o chat de voz por proximidade esteja ativo. Seu bot sairá automaticamente dos outros."
    select-menu:
      placeholder: "Por favor, selecione um servidor."
  two-factor-authentication:
    title: "Autenticação de dois fatores"
    description: "Seu servidor do Discord exige que a conta do proprietário do bot tenha a autenticação de dois fatores ativada. Configure-a ou desative este requisito nas configurações do servidor seguindo este caminho: `Moderação › Configuração de Segurança › (Permissões ›) Exigir 2FA para ações de moderador`."
  permissions:
    title: "Permissões"
    description: "Para funcionar corretamente, seu bot deve ter a permissão `Administrador` no seu servidor do Discord. Para isso, atribua ao bot um cargo com a permissão `Administrador` ou peça a {bot-owner-mention} para executar {configure-discord-command} para atualizar suas permissões."
    description-owner: "Para funcionar corretamente, seu bot deve ter a permissão `Administrador` no seu servidor do Discord. Clique no botão abaixo para concedê-la."
  voice-chat:
    title: "Chat de voz"
  range:
    title: "Distância"
    description: "Personalize o alcance do chat de voz por proximidade."
    select-menu:
      placeholder: "Por favor, selecione uma distância."
      select-option:
        long-range-mode:
          label: "Modo de longas distâncias"
        short-range-mode:
          label: "Modo de curtas distâncias"
        customized:
          label: "Personalizado"
        description: "Raio horizontal: {horizontal-radius} blocos — Raio vertical: {vertical-radius} blocos"
  active-worlds:
    title: "Mundos ativos"
    description: "Escolha os mundos onde o Skoice estará ativo."
    select-menu:
      placeholder: "Por favor, selecione os mundos desejados."
  excluded-players:
    title: "Jogadores excluídos"
    description: "Escolha os tipos de jogadores excluídos do chat de voz por proximidade e se eles ainda podem se comunicar entre si."
    excluded-player-types:
      select-menu:
        placeholder: "Por favor, selecione os tipos de jogadores excluídos."
        players-on-death-screen-excluded:
          label: "Jogadores na tela de morte"
        spectators-excluded:
          label: "Espectadores"
    excluded-player-behavior:
      select-menu:
        same-world:
          label: "Sempre comunicar no mesmo mundo"
        in-range:
          label: "Comunicar quando estiver dentro do alcance"
        disabled:
          label: "Nunca comunicar"
  teams:
    title: "Equipes"
    description: "Selecione o sistema que o Skoice usa para determinar quais jogadores pertencem à mesma equipe e os comportamentos que se aplicam às equipes. O sistema de equipes integrado do Minecraft pode ser usado com `/team` ou com plugins e datapacks que o gerenciam. O Skoice também oferece suporte a plugins de terceiros como [Parties](https://www.spigotmc.org/resources/parties-an-advanced-parties-manager.3709/). O plugin correspondente deve estar instalado para que um provedor funcione; caso contrário, os recursos de equipe são desativados."
    team-provider:
      select-menu:
        select-option:
          vanilla:
            label: "Vanilla"
          parties:
            label: "Parties"
    team-behaviors:
      select-menu:
        placeholder: "Por favor, selecione os comportamentos desejados."
        team-communication:
          label: "Sempre Permitir que Membros da Equipe se Comuniquem"
        separated-teams:
          label: "Impedir Comunicação Entre Equipes"
  chaining:
    title: "Encadeamento"
    description: "Selecione a distância adicional permitida quando os jogadores estão encadeados. O encadeamento geralmente ocorre quando um jogador está entre dois outros jogadores que não deveriam conseguir se comunicar. Nesse caso, o alcance é expandido para permitir que todos os três jogadores se ouçam."
    select-menu:
      disabled:
        label: "Desativado — Sem encadeamento permitido"
      short:
        label: "Curto — +25% do alcance inicial"
      medium:
        label: "Médio — +50% do alcance inicial"
      long:
        label: "Longo — +100% do alcance inicial"
  discord-integration:
    title: "Integração com o Discord"
  voice-channel:
    title: "Canal de voz"
    description: "Selecione o canal que os jogadores devem entrar para utilizar o chat de voz por proximidade. Deve estar em uma categoria. Observe que os jogadores serão automaticamente silenciados neste canal."
    select-menu:
      placeholder: "Por favor, selecione um canal de voz."
      select-option:
        new-voice-channel:
          label: "Novo canal de voz"
          description: "O Skoice irá configurar automaticamente um canal de voz."
  text-chat:
    title: "Chat de texto"
    description: "Escolha se os jogadores podem enviar mensagens de texto nos canais de proximidade ou não."
  channel-visibility:
    title: "Visibilidade do canal"
    description: "Defina a visibilidade dos canais temporários criados pelo Skoice."
  in-game-messages:
    title: "Mensagens no jogo"
  login-notification:
    title: "Notificação de login"
    description: "Altere a mensagem enviada aos jogadores que não vincularam suas contas quando entram no seu servidor Minecraft."
    select-menu:
      always-remind:
        label: "Sempre lembrar"
      remind-once:
        label: "Lembrar uma vez"
      never-remind:
        label: "Nunca lembrar"
  action-bar-alerts:
    title: "Alertas na barra de ação"
    description: "Ative ou desative os alertas enviados aos jogadores no seu servidor Minecraft relacionados ao chat de voz por proximidade."
    select-menu:
      placeholder: "Por favor, selecione os alertas desejados."
      linking-suggestion:
        label: "\"Há jogadores por perto usando o Skoice. Digite \"/skoice link\" para participar!\""
      connecting-alert:
        label: "\"Você está perto de outros jogadores. Diga oi!\""
      disconnecting-alert:
        label: "\"Você está se distanciando de jogadores próximos.\""
      muted-alert:
        label: "\"Microfone desativado.\""
      deafened-alert:
        label: "\"Som desativado.\""
  invite-link:
    title: "Link de convite"
    description: "Ative ou desative se o nome do servidor do Discord aparece como um link de convite clicável nas mensagens do chat do Minecraft. O Skoice cria um convite permanente no canal de voz por proximidade que você configurou. Desative isto se não quiser nenhum."
  tooltips:
    title: "Dicas"
    description: "Ative ou desative mensagens interativas no seu servidor Minecraft. Você pode querer desativar esta configuração se o seu servidor estiver rodando na Edição Bedrock ou se as dicas estiverem desativadas nas configurações do Minecraft. Apenas operadores podem receber mensagens interativas."
  advanced-settings:
    title: "Configurações avançadas"
  link-synchronization:
    title: "Sincronização de vínculos"
    description: "Ative ou desative a sincronização de plugins externos com o Skoice. Quando os jogadores vinculam suas contas via Skoice ou um plugin selecionado, a sincronização em tempo real ocorre em ambos os lados. Atualizar esta opção requer que você reinicie seu servidor Minecraft para que ela tenha efeito."
    select-menu:
      placeholder: "Por favor, selecione os plugins desejados."
  release-channel:
    title: "Canal de lançamento"
    description: "Selecione a versão do Skoice que você deseja usar."
  language:
    title: "Idioma"
    description: "Escolha o idioma para as mensagens."
  skoice-proximity-voice-chat:
    title: "Skoice: chat de voz por proximidade"
  linking-process:
    title: "Processo de vinculação"
  error:
    title: "Erro"
field:
  configuration-complete:
    title: "Configuração completa"
    description: "O Skoice está configurado. Digite {link-discord-command} para vincular sua conta do Discord ao Minecraft. Os jogadores devem vincular suas contas para usar o chat de voz por proximidade."
  notified-players-cleared:
    title: "Jogadores notificados limpos"
    description: "Você limpou os jogadores notificados. Jogadores que já receberam o lembrete para vincular suas contas serão notificados novamente."
  incomplete-configuration:
    title: "Configuração incompleta"
    description: "O Skoice não está configurado corretamente. Por favor, contate um administrador do servidor."
  incomplete-configuration-server-manager:
    title: "Configuração incompleta"
    description: "Digite {configure-discord-command} ou clique no botão abaixo para completar a configuração e usar o Skoice."
  incomplete-configuration-alternative-server-manager:
    title: "Configuração incompleta"
    description: "Você excluiu o canal de voz principal ou sua categoria. Digite {configure-discord-command} para completar a configuração e usar o Skoice."
  download:
    title: "Baixar"
    description: "[Baixe o plugin]({spigotmc-url}) e instale-o no seu servidor de Minecraft."
  donating:
    title: "Doação"
    description: "O Skoice é um software gratuito. Se você gostar, pode nos ajudar [doando]({open-collective-url})."
  contributing:
    title: "Contribuição"
    description: "Interessado em nos ajudar em moldar o futuro do Skoice? [Contribua em nossa página do GitHub]({github-url})!"
  long-range-mode:
    title: "Modo de longas distâncias"
    description: "Escolha este modo se planeja jogar em modos de jogo de mundo aberto."
  short-range-mode:
    title: "Modo de curtas distâncias"
    description: "Escolha este modo se planeja jogar em modos de jogo que requerem apenas uma área limitada."
  customized:
    title: "Personalizado"
    description: "Defina distâncias de acordo com suas preferências pessoais."
  production-channel:
    title: "Canal de produção"
    description: "Escolha este canal para usar a versão pública. É mais provável que ofereça uma experiência estável."
  beta-channel:
    title: "Canal beta"
    description: "Escolha este canal para descobrir e testar nossas últimas funcionalidades que ainda não foram lançadas ao público. Esta versão pode conter bugs."
  verification-code:
    title: "Código de verificação"
    description: "Envie `{link-minecraft-command} {code}` em jogo para completar o processo."
  account-linked:
    title: "Conta vinculada"
    description: "Sua conta do Discord foi vinculada ao Minecraft. Entre no canal de voz {voice-channel} para usar o chat de voz por proximidade."
  account-unlinked:
    title: "Conta desvinculada"
    description: "Sua conta do Discord foi desvinculada do Minecraft."
  account-not-linked:
    title: "Conta não vinculada"
    description: "Sua conta do Discord não está vinculada ao Minecraft. Digite {link-discord-command} para vinculá-la e usar o chat de voz por proximidade."
  account-already-linked:
    title: "Conta já vinculada"
    description: "Sua conta do Discord já está vinculada à conta do Minecraft `{minecraft-username}`. Digite {unlink-discord-command} para desvinculá-la."
  restricted-command:
    title: "Comando restrito"
    description: "Este comando deve ser executado em um servidor do Discord."
  access-denied:
    title: "Acesso negado"
    description: "Você não tem a permissão necessária para executar este comando."
  illegal-value:
    title: "Valor ilegal"
    description: "Os valores devem ser números inteiros maiores que 0."
  proximity-channel-deleted:
    title: "Canal de proximidade excluído"
    description: "Você excluiu um canal usado pelo chat de voz por proximidade. Estes canais são automaticamente excluídos quando não são mais necessários. Você não deveria fazer isso manualmente."
  invite-link-revoked:
    title: "Link de convite revogado"
    description: "Você revogou um link de convite que o Skoice usava para permitir que jogadores do Minecraft entrassem no seu servidor do Discord. O Skoice criará um novo quando necessário. Para impedir isso, desative a configuração `Link de convite` em `Configuração › Mensagens no jogo` executando {configure-discord-command}."
  shared-bot:
    title: "Bot Compartilhado"
    description: "Parece que seu bot está executando vários programas. No entanto, ele deve ser dedicado ao Skoice para funcionar corretamente. Você pode criar um novo [seguindo estas instruções]({creation-guide-url}). Depois de obter o token, digite `{token-minecraft-command}` seguido do token no seu servidor de Minecraft. Se o seu bot não está executando vários programas, peça ajuda no nosso servidor do Discord pressionando o botão abaixo."
button-label:
  configure-now: "Configurar agora"
  support-server: "Servidor de suporte"
  clear-notified-players: "Limpar jogadores notificados"
  refresh: "Recarregar"
  update-permissions: "Atualizar permissões"
  explore-more-settings: "Explorar Mais Configurações"
select-option:
  default:
    description: "Esta opção é selecionada por padrão."
  undesirable:
    description: "Esta opção pode causar comportamentos indesejáveis."
  enabled:
    label: "Habilitado"
  disabled:
    label: "Desabilitado"
  too-many-options:
    label: "Muitas opções"
    description: "O Skoice não consegue carregar mais opções."
text-input:
  category-name:
    label: "Nome da categoria"
    default-value: "Skoice"
  voice-channel-name:
    label: "Nome do canal de voz"
    default-value: "Chat de voz por proximidade"
  horizontal-radius:
    label: "Raio horizontal"
  vertical-radius:
    label: "Raio vertical"
voice-channel-status: "Impossível falar — Nenhum jogador próximo"
proximity-channel-name: "Canal de proximidade"
