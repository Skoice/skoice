command-description:
  configure: "Konfigurer Skoice."
  link: "Koble Discord-kontoen din til Minecraft."
  unlink: "Koble fra Discord kontoen din fra Minecraft."
  invite: "Få proximity tale chat på serveren din."
menu:
  invite-footer: "Vil du ha Skoice på serveren din? Skriv {invite-discord-command}!"
  review-footer: "Har du det gøy med Skoice? Vurder å [legge igjen en anmeldelse på SpigotMC]({spigotmc-url})!"
  contributors-footer: "Skoice • carlodrift, Lucas_Cdry og bidragsytere"
  configuration:
    title: "Konfigurasjon"
  server:
    title: "Server"
    description: "For å fungere skikkelig, kan ikke boten din finnes på flere Discord-servere. Velg serveren hvor du vil at proximity skal være aktiv. Boten din vil automatisk forlate den/de andre."
    select-menu:
      placeholder: "Vennligst velg en server."
  two-factor-authentication:
    title: "Tofaktorautentisering"
    description: "Discord-serveren din krever at kontoen til bot-eieren har tofaktorautentisering aktivert. Sett den opp, eller deaktiver dette kravet i serverinnstillingene ved å følge denne stien: `Moderering › Sikkerhetsoppsett › (Tillatelser ›) Krev 2FA for moderatorhandlinger`."
  permissions:
    title: "Tillatelser"
    description: "For å fungere skikkelig må boten din ha tillatelsen `Administrator` på Discord-serveren din. For å gjøre dette, gi boten en rolle med tillatelsen `Administrator`, eller be {bot-owner-mention} om å kjøre {configure-discord-command} for å oppdatere tillatelsene."
    description-owner: "For å fungere skikkelig må boten din ha tillatelsen `Administrator` på Discord-serveren din. Klikk på knappen nedenfor for å gi den."
  voice-chat:
    title: "Talechat"
  range:
    title: "Rekkevidde"
    description: "Tilpass rekkevidden til proximity chat."
    select-menu:
      placeholder: "Vennligst velg en rekkevidde."
      select-option:
        long-range-mode:
          label: "Lang rekkevidde-modus"
        short-range-mode:
          label: "Kort rekkevidde-modus"
        customized:
          label: "Tilpasset"
        description: "Horisontal radius: {horizontal-radius} blokker — Vertikal radius: {vertical-radius} blokker"
  active-worlds:
    title: "Aktive verdener"
    description: "Velg verdenene der Skoice er aktiv."
    select-menu:
      placeholder: "Vennligst velg de ønskede verdenene."
  excluded-players:
    title: "Ekskluderte spillere"
    description: "Velg hvilke typer spillere som ekskluderes fra proximity chat, og om de fortsatt kan kommunisere med hverandre."
    excluded-player-types:
      select-menu:
        placeholder: "Vennligst velg de ekskluderte spillertypene."
        players-on-death-screen-excluded:
          label: "Spillere på dødsskjermen"
        spectators-excluded:
          label: "Tilskuere"
    excluded-player-behavior:
      select-menu:
        same-world:
          label: "Kommuniser alltid i samme verden"
        in-range:
          label: "Kommuniser når innenfor rekkevidde"
        disabled:
          label: "Kommuniser aldri"
  teams:
    title: "Lag"
    description: "Velg systemet Skoice bruker for å avgjøre hvilke spillere som tilhører samme lag, og oppførselen som gjelder for lag. Minecrafts innebygde lagsystem kan brukes med `/team` eller med plugins og datapakker som administrerer det. Skoice støtter også tredjeparts-plugins som [Parties](https://www.spigotmc.org/resources/parties-an-advanced-parties-manager.3709/). Det tilsvarende pluginet må være installert for at en leverandør skal fungere, ellers deaktiveres lagfunksjonene."
    team-provider:
      select-menu:
        select-option:
          vanilla:
            label: "Vanilla"
          parties:
            label: "Parties"
    team-behaviors:
      select-menu:
        placeholder: "Vennligst velg den ønskede oppførselen."
        team-communication:
          label: "Tillat alltid lagmedlemmer å kommunisere"
        separated-teams:
          label: "Forhindre kommunikasjon mellom lag"
  chaining:
    title: "Kjeding"
    description: "Velg den ekstra avstanden som tillates når spillere danner kjede. Kjeding skjer vanligvis når en spiller er mellom to andre spillere som ikke burde kunne kommunisere. I så fall utvides rekkevidden slik at alle tre spillerne kan høre hverandre."
    select-menu:
      disabled:
        label: "Deaktivert — Ingen kjeding tillatt"
      short:
        label: "Kort — +25% av den opprinnelige rekkevidden"
      medium:
        label: "Middels — +50% av den opprinnelige rekkevidden"
      long:
        label: "Lang — +100% av den opprinnelige rekkevidden"
  discord-integration:
    title: "Discord-integrasjon"
  voice-channel:
    title: "Talekanal"
    description: "Velg kanalen spillere må bli med i for å bruke proximity chat. Den må være i en kategori. Merk at spillere automatisk blir dempet i denne kanalen."
    select-menu:
      placeholder: "Velg en talekanal."
      select-option:
        new-voice-channel:
          label: "Ny Talekanal"
          description: "Skoice vil automatisk sette opp en talekanal."
  text-chat:
    title: "Tekstchat"
    description: "Velg om spillere kan sende tekstmeldinger i proximity-kanaler."
  channel-visibility:
    title: "Kanal synlighet"
    description: "Slå av/på synligheten til de midlertidige kanalene skapt av Skoice."
  in-game-messages:
    title: "Meldinger i spillet"
  login-notification:
    title: "Innloggingsvarsel"
    description: "Slå av/på meldingen som sendes til spillere som ikke har koblet kontoene sine, når de logger inn på Minecraft-serveren din."
    select-menu:
      always-remind:
        label: "Alltid påminn"
      remind-once:
        label: "Påminn én gang"
      never-remind:
        label: "Aldri påminn"
  action-bar-alerts:
    title: "Handlingslinje-varsler"
    description: "Slå av/på varslene som sendes til spillere på Minecraft-serveren din angående proximity chat."
    select-menu:
      placeholder: "Vennligst velg de ønskede varslene."
      linking-suggestion:
        label: "\"Spillere i nærheten bruker Skoice. Skriv \"/skoice link\" for å bli med!\""
      connecting-alert:
        label: "\"Du er nær andre spillere. Si hei!\""
      disconnecting-alert:
        label: "\"Du beveger deg vekk fra spillere i nærheten.\""
      muted-alert:
        label: "\"Du er dempet.\""
      deafened-alert:
        label: "\"Lyden din er slått av.\""
  invite-link:
    title: "Invitasjonslenke"
    description: "Slå av/på om Discord-servernavnet vises som en klikkbar invitasjonslenke i Minecraft-chatmeldinger. Skoice oppretter en permanent invitasjon på den konfigurerte proximity-talekanalen din. Deaktiver dette hvis du ikke vil ha en."
  tooltips:
    title: "Verktøytips"
    description: "Slå av/på interaktive meldinger på Minecraft-serveren din. Du vil kanskje deaktivere denne innstillingen hvis serveren din kjører på Bedrock Edition, eller hvis verktøytips er deaktivert i Minecraft-innstillingene. Bare operatører kan motta interaktive meldinger."
  advanced-settings:
    title: "Avanserte innstillinger"
  link-synchronization:
    title: "Lenkesynkronisering"
    description: "Slå av/på synkroniseringen av eksterne plugins med Skoice. Når spillere kobler kontoene sine via Skoice eller et valgt plugin, skjer sanntidssynkronisering på begge sider. Oppdatering av dette alternativet krever at du starter Minecraft-serveren din på nytt for at det skal tre i kraft."
    select-menu:
      placeholder: "Vennligst velg de ønskede pluginene."
  release-channel:
    title: "Utgivelseskanal"
    description: "Velg versjonen av Skoice du vil bruke."
  language:
    title: "Språk"
    description: "Velg språket som skal vises for meldinger."
  skoice-proximity-voice-chat:
    title: "Skoice: Proximity chat"
  linking-process:
    title: "Koble Prosess"
  error:
    title: "Feil"
field:
  configuration-complete:
    title: "Konfigurasjon fullført"
    description: "Skoice er nå konfigurert. Skriv {link-discord-command} for å koble Discord-kontoen din til Minecraft. Spillere må koble kontoene sine for å bruke proximity chat."
  notified-players-cleared:
    title: "Varslede spillere tilbakestilt"
    description: "Du har tilbakestilt varslede spillere. Spillere som allerede har mottatt påminnelsen om å koble kontoene sine, vil nå bli varslet igjen."
  incomplete-configuration:
    title: "Ufullstendig konfigurasjon"
    description: "Skoice er ikke riktig konfigurert. Kontakt en administrator på serveren."
  incomplete-configuration-server-manager:
    title: "Ufullstendig konfigurasjon"
    description: "Skriv {configure-discord-command} eller klikk på knappen nedenfor for å fullføre konfigurasjonen og bruke Skoice."
  incomplete-configuration-alternative-server-manager:
    title: "Ufullstendig konfigurasjon"
    description: "Du har slettet hovedtalekanalen eller kategorien dens. Skriv {configure-discord-command} for å fullføre konfigurasjonen og bruke Skoice."
  download:
    title: "Nedlast"
    description: "[Hent pluginet]({spigotmc-url}) og installer det på Minecraft-serveren din."
  donating:
    title: "Donere"
    description: "Skoice er en fri programvare. Hvis du liker det, kan du hjelpe oss ved å [donating]({open-collective-url})."
  contributing:
    title: "Bidra"
    description: "Interessert med å hjelpe oss å forme fremtiden til Skoice? [Bidra på vår GitHub-side]({github-url})!"
  long-range-mode:
    title: "Lang rekkevidde-modus"
    description: "Velg denne modusen hvis du planlegger å spille åpne verden-spillmoduser."
  short-range-mode:
    title: "Kort rekkevidde-modus"
    description: "Velg denne modusen hvis du planlegger å spille spillmoduser som bare krever et begrenset område."
  customized:
    title: "Tilpasset"
    description: "Angi avstander i henhold til dine personlige innstillinger."
  production-channel:
    title: "Produksjonskanal"
    description: "Velg denne kanalen for å bruke den offentlige versjonen. Den vil sannsynligvis gi en mer stabil opplevelse."
  beta-channel:
    title: "Beta-kanal"
    description: "Velg denne kanalen for å oppdage og teste våre nyeste funksjoner som ennå ikke er utgitt til offentligheten. Denne versjonen kan inneholde feil."
  verification-code:
    title: "Bekreftelseskode"
    description: "Skriv `{link-minecraft-command} {code}` i spillet for å fullføre prosessen."
  account-linked:
    title: "Konto Koblet"
    description: "Discord-kontoen din er koblet til Minecraft. Bli med i talekanalen {voice-channel} for å bruke proximity chat."
  account-unlinked:
    title: "Konto Frakoblet"
    description: "Discord kontoen din har blitt koblet fra Minecraft."
  account-not-linked:
    title: "Konto Ikke Koblet Til"
    description: "Discord-kontoen din er ikke koblet til Minecraft. Skriv {link-discord-command} for å koble den og bruke proximity chat."
  account-already-linked:
    title: "Konto allerede koblet"
    description: "Discord-kontoen din er allerede koblet til Minecraft-kontoen `{minecraft-username}`. Skriv {unlink-discord-command} for å koble den fra."
  restricted-command:
    title: "Begrenset kommando"
    description: "Denne kommandoen må utføres på en Discord-server."
  access-denied:
    title: "Ingen tilgang"
    description: "Du har ikke den nødvendige tillatelsen til å utføre denne kommandoen."
  illegal-value:
    title: "Ulovlig verdi"
    description: "Verdier må være hele tall større enn 0."
  proximity-channel-deleted:
    title: "Proximity-kanal slettet"
    description: "Du har slettet en kanal som brukes av proximity chat. Disse kanalene slettes automatisk når de ikke lenger trengs. Du bør ikke gjøre det manuelt."
  invite-link-revoked:
    title: "Invitasjonslenke tilbakekalt"
    description: "Du har tilbakekalt en invitasjonslenke som Skoice brukte for å la Minecraft-spillere bli med på Discord-serveren din. Skoice oppretter en ny når det trengs. For å stoppe dette, deaktiver innstillingen `Invitasjonslenke` i `Konfigurasjon › Meldinger i spillet` ved å kjøre {configure-discord-command}."
  shared-bot:
    title: "Delt bot"
    description: "Det ser ut til at boten din kjører flere programmer. Den må imidlertid være dedikert til Skoice for å fungere skikkelig. Du kan opprette en ny ved å [følge disse instruksjonene]({creation-guide-url}). Når du har hentet tokenet, skriv `{token-minecraft-command}` etterfulgt av tokenet på Minecraft-serveren din. Hvis boten din ikke kjører flere programmer, be om hjelp på Discord-serveren vår ved å trykke på knappen nedenfor."
button-label:
  configure-now: "Konfigurer nå"
  support-server: "Støtteserver"
  clear-notified-players: "Tøm varslede spillere"
  refresh: "Oppdater"
  update-permissions: "Oppdater tillatelser"
  explore-more-settings: "Utforsk flere innstillinger"
select-option:
  default:
    description: "Dette valget er valgt som standard."
  undesirable:
    description: "Dette alternativet kan forårsake uønsket oppførsel."
  enabled:
    label: "Aktivert"
  disabled:
    label: "Deaktivert"
  too-many-options:
    label: "For mange alternativer"
    description: "Skoice kan ikke laste inn flere alternativer."
text-input:
  category-name:
    label: "Kategori Navn"
    default-value: "Skoice"
  voice-channel-name:
    label: "Talekanal navn"
    default-value: "Proximity stemme chat"
  horizontal-radius:
    label: "Horisontal Radius"
  vertical-radius:
    label: "Vertikal radius"
voice-channel-status: "Kan ikke snakke — Ingen spillere i nærheten"
proximity-channel-name: "Proximity-kanal"
