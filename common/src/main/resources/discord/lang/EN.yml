command-description:
  configure: "Configure Skoice."
  link: "Link your Discord account to Minecraft."
  unlink: "Unlink your Discord account from Minecraft."
  invite: "Get the proximity voice chat on your server."
menu:
  invite-footer: "Want Skoice on your server? Type {invite-discord-command}!"
  review-footer: "Having fun with Skoice? Consider [leaving a review on SpigotMC]({spigotmc-url})!"
  contributors-footer: "Skoice • carlodrift, Lucas_Cdry and contributors"
  configuration:
    title: "Configuration"
  server:
    title: "Server"
    description: "In order to work properly, your bot cannot be present on multiple Discord servers. Select the server where you want the proximity voice chat to be active. Your bot will automatically leave the other ones."
    select-menu:
      placeholder: "Please select a server."
  two-factor-authentication:
    title: "Two-Factor Authentication"
    description: "Your Discord server requires the bot owner's account to have two-factor authentication enabled. Set it up or disable this requirement in server settings by following this path: `Moderation › Safety Setup › (Permissions ›) Require 2FA for moderator actions`."
  permissions:
    title: "Permissions"
    description: "In order to work properly, your bot must have the `Administrator` permission on your Discord server. To do this, either add a role with `Administrator` permission to the bot, or ask {bot-owner-mention} to run {configure-discord-command} to update its permissions."
    description-owner: "In order to work properly, your bot must have the `Administrator` permission on your Discord server. Click the button below to grant it."
  voice-chat:
    title: "Voice Chat"
  range:
    title: "Range"
    description: "Customize the range of the proximity voice chat."
    select-menu:
      placeholder: "Please select a range."
      select-option:
        long-range-mode:
          label: "Long-Range Mode"
        short-range-mode:
          label: "Short-Range Mode"
        customized:
          label: "Customized"
        description: "Horizontal Radius: {horizontal-radius} blocks — Vertical Radius: {vertical-radius} blocks"
  active-worlds:
    title: "Active Worlds"
    description: "Choose the worlds where Skoice is active."
    override-title: "Activity"
    override-description: "Choose whether Skoice is active in the worlds of this override."
    select-menu:
      placeholder: "Please select the desired worlds."
      select-option:
        overridden:
          description: "Controlled by the \"{name}\" override."
  excluded-players:
    title: "Excluded Players"
    description: "Choose the types of players excluded from the proximity voice chat and whether they can still communicate with one another."
    excluded-player-types:
      select-menu:
        placeholder: "Please select the excluded types of players."
        players-on-death-screen-excluded:
          label: "Players on Death Screen"
        spectators-excluded:
          label: "Spectators"
    excluded-player-behavior:
      select-menu:
        same-world:
          label: "Always Communicate in the Same World"
        in-range:
          label: "Communicate When in Range"
        disabled:
          label: "Never Communicate"
  teams:
    title: "Teams"
    description: "Select the system Skoice uses to determine which players belong to the same team and the behaviors that apply to teams. Minecraft's built-in team system can be used with `/team` or with plugins and datapacks that manage it. Skoice also supports third-party plugins such as [Parties](https://www.spigotmc.org/resources/parties-an-advanced-parties-manager.3709/). The matching plugin must be installed for a provider to work, otherwise team features are disabled."
    team-provider:
      select-menu:
        select-option:
          vanilla:
            label: "Vanilla"
          parties:
            label: "Parties"
    override-description: "Select the behaviors that apply to teams in the worlds of this override. The team system itself is shared by every world and is selected in `Voice Chat › Teams`."
    team-behaviors:
      select-menu:
        placeholder: "Please select the desired behaviors."
        team-communication:
          label: "Always Allow Team Members to Communicate"
        separated-teams:
          label: "Prevent Cross-Team Communication"
  chaining:
    title: "Chaining"
    description: "Select the additional distance allowed when players are chaining. Chaining usually happens when a player is between two other players who should not be able to communicate. In that case, the range is expanded to allow all three players to hear each other."
    select-menu:
      disabled:
        label: "Disabled — No chaining allowed"
      short:
        label: "Short — +25% of the initial range"
      medium:
        label: "Medium — +50% of the initial range"
      long:
        label: "Long — +100% of the initial range"
  discord-integration:
    title: "Discord Integration"
  voice-channel:
    title: "Voice Channel"
    description: "Select the channel players have to join to use the proximity voice chat. It must be in a category. Please note that players will automatically be muted in this channel."
    select-menu:
      placeholder: "Please select a voice channel."
      select-option:
        new-voice-channel:
          label: "New Voice Channel"
          description: "Skoice will automatically set up a voice channel."
  text-chat:
    title: "Text Chat"
    description: "Choose whether or not players can send text messages in proximity channels."
  channel-visibility:
    title: "Channel Visibility"
    description: "Toggle the visibility of the temporary channels created by Skoice."
  in-game-messages:
    title: "In-Game Messages"
  login-notification:
    title: "Login Notification"
    description: "Toggle the message sent to players who have not linked their accounts when they log in to your Minecraft server."
    select-menu:
      always-remind:
        label: "Always Remind"
      remind-once:
        label: "Remind Once"
      never-remind:
        label: "Never Remind"
  action-bar-alerts:
    title: "Action Bar Alerts"
    description: "Toggle the alerts sent to players on your Minecraft server related to the proximity voice chat."
    select-menu:
      placeholder: "Please select the desired alerts."
      linking-suggestion:
        label: "\"Near players are using Skoice. Type \"/skoice link\" to join!\""
      connecting-alert:
        label: "\"You are near other players. Say hi!\""
      disconnecting-alert:
        label: "\"You are moving away from near players.\""
      muted-alert:
        label: "\"You are muted.\""
      deafened-alert:
        label: "\"You are deafened.\""
  invite-link:
    title: "Invite Link"
    description: "Toggle whether the Discord server name appears as a clickable invite link in Minecraft chat messages. Skoice creates a permanent invite on your configured proximity voice channel. Disable this if you do not want one."
  tooltips:
    title: "Tooltips"
    description: "Toggle interactive messages on your Minecraft server. You may want to disable this setting if your server is running on Bedrock Edition or if tooltips are disabled in Minecraft settings. Only operators can receive interactive messages."
  world-overrides:
    title: "Per-World Settings"
    description: "Give a group of worlds its own range, active state, excluded players, teams and action bar alerts. Anything an override does not change is inherited from the global settings."
    rule: "Worlds are matched by name or by regular expression. When several overrides match the same world, the **first one in the list** wins — reorder them from an override's own menu."
    empty: "You have no override yet. Every world uses the global settings."
    entry: "**{priority}. {name}**"
    entry-worlds: "Worlds: {worlds}"
    entry-patterns: "Patterns: {patterns}"
    entry-empty: "*No world yet.*"
    select-menu:
      placeholder: "Please select an override to edit."
    create-modal:
      title: "Create an Override"
    rename-modal:
      title: "Rename the Override"
  world-override:
    title: "Override"
    description: "Priority **{priority}** of **{total}** — when several overrides match the same world, the first one in the list wins."
    empty: "-# This override covers no world yet. Open `Worlds` to choose some."
    overridden: "Overridden"
    inherited: "Inherited from the global settings"
  world-override-worlds:
    title: "Worlds"
    description: "Choose the worlds this override applies to."
    patterns: "Patterns: {patterns}"
    no-pattern: "-# Worlds that do not exist yet — generated or temporary ones — can be covered by a regular expression instead."
    select-menu:
      placeholder: "Please select the desired worlds."
    patterns-modal:
      title: "Edit the Patterns"
  world-override-deletion:
    title: "Delete an Override"
    description: "Are you sure you want to delete **{name}**? Its settings will be lost and its worlds will fall back to the global settings."
  advanced-settings:
    title: "Advanced Settings"
  link-synchronization:
    title: "Link Synchronization"
    description: "Toggle the synchronization of external plugins with Skoice. When players link their accounts via Skoice or a selected plugin, real-time synchronization occurs on both sides. Updating this option requires you to restart your Minecraft server for it to take effect."
    select-menu:
      placeholder: "Please select the desired plugins."
  release-channel:
    title: "Release Channel"
    description: "Select the version of Skoice you want to use."
  language:
    title: "Language"
    description: "Choose the language used to display messages."
  skoice-proximity-voice-chat:
    title: "Skoice: Proximity Voice Chat"
  linking-process:
    title: "Linking Process"
  error:
    title: "Error"
field:
  configuration-complete:
    title: "Configuration Complete"
    description: "Skoice is now configured. Type {link-discord-command} to link your Discord account to Minecraft. Players must link their accounts to use the proximity voice chat."
  notified-players-cleared:
    title: "Notified Players Cleared"
    description: "You have cleared notified players. Players who have already received the reminder to link their accounts will now be notified again."
  incomplete-configuration:
    title: "Incomplete Configuration"
    description: "Skoice is not configured correctly. Please contact an administrator of the server."
  incomplete-configuration-server-manager:
    title: "Incomplete Configuration"
    description: "Type {configure-discord-command} or click the button below to complete the configuration and use Skoice."
  incomplete-configuration-alternative-server-manager:
    title: "Incomplete Configuration"
    description: "You have deleted the main voice channel or its category. Type {configure-discord-command} to complete the configuration and use Skoice."
  download:
    title: "Download"
    description: "[Get the plugin]({spigotmc-url}) and install it on your Minecraft server."
  donating:
    title: "Donating"
    description: "Skoice is a free software. If you like it, you can help us by [donating]({open-collective-url})."
  contributing:
    title: "Contributing"
    description: "Interested in helping us shape the future of Skoice? [Contribute on our GitHub page]({github-url})!"
  long-range-mode:
    title: "Long-Range Mode"
    description: "Choose this mode if you plan to play open world game modes."
  short-range-mode:
    title: "Short-Range Mode"
    description: "Choose this mode if you plan to play game modes that only require a limited area."
  customized:
    title: "Customized"
    description: "Set distances according to your personal preferences."
  production-channel:
    title: "Production Channel"
    description: "Choose this channel to use the public version. It is more likely to offer a stable experience."
  beta-channel:
    title: "Beta Channel"
    description: "Choose this channel to discover and test our latest features that are not yet released to the public. This version may contain bugs."
  verification-code:
    title: "Verification Code"
    description: "Type `{link-minecraft-command} {code}` in game to complete the process."
  account-linked:
    title: "Account Linked"
    description: "Your Discord account has been linked to Minecraft. Join the voice channel {voice-channel} to use the proximity voice chat."
  account-unlinked:
    title: "Account Unlinked"
    description: "Your Discord account has been unlinked from Minecraft."
  account-not-linked:
    title: "Account Not Linked"
    description: "Your Discord account is not linked to Minecraft. Type {link-discord-command} to link it and use the proximity voice chat."
  account-already-linked:
    title: "Account Already Linked"
    description: "Your Discord account is already linked to the Minecraft account `{minecraft-username}`. Type {unlink-discord-command} to unlink it."
  restricted-command:
    title: "Restricted Command"
    description: "This command must be performed on a Discord server."
  access-denied:
    title: "Access Denied"
    description: "You do not have the required permission to perform this command."
  illegal-value:
    title: "Illegal Value"
    description: "Values must be whole numbers greater than 0."
  invalid-pattern:
    title: "Invalid Patterns"
    description: "{patterns} could not be saved because they are not valid regular expressions. Your other patterns were saved."
  proximity-channel-deleted:
    title: "Proximity Channel Deleted"
    description: "You have deleted a channel used by the proximity voice chat. These channels are automatically deleted when they are no longer needed. You should not be doing it manually."
  invite-link-revoked:
    title: "Invite Link Revoked"
    description: "You have revoked an invite link that Skoice was using to let Minecraft players join your Discord server. Skoice will recreate one when needed. To stop this, disable the `Invite Link` setting in `Configuration › In-Game Messages` by running {configure-discord-command}."
  shared-bot:
    title: "Shared Bot"
    description: "It seems like your bot is running multiple programs. However, it must be dedicated to Skoice in order to work properly. You can create a new one by [following these instructions]({creation-guide-url}). Once you have retrieved its token, type `{token-minecraft-command}` followed by the token on your Minecraft server. If your bot is not running multiple programs, please ask for help on our Discord server by pressing the button below."
button-label:
  configure-now: "Configure Now"
  support-server: "Support Server"
  clear-notified-players: "Clear Notified Players"
  refresh: "Refresh"
  update-permissions: "Update Permissions"
  explore-more-settings: "Explore More Settings"
  create-override: "Create Override"
  rename-override: "Rename"
  edit-patterns: "Edit Patterns"
  move-override-up: "Move Up"
  move-override-down: "Move Down"
  delete-override: "Delete"
  confirm-deletion: "Delete Override"
  cancel: "Cancel"
  reset-to-global: "Reset to Global"
select-option:
  default:
    description: "This option is selected by default."
  inherited:
    description: "This option is inherited from the global settings."
  undesirable:
    description: "This option can cause undesirable behaviors."
  enabled:
    label: "Enabled"
  disabled:
    label: "Disabled"
  too-many-options:
    label: "Too Many Options"
    description: "Skoice is unable to load more options."
text-input:
  category-name:
    label: "Category Name"
    default-value: "Skoice"
  voice-channel-name:
    label: "Voice Channel Name"
    default-value: "Proximity Voice Chat"
  override-name:
    label: "Name"
    default-value: "New Override"
  override-patterns:
    label: "Patterns"
    description: "One regular expression per line."
    placeholder: "minigame_.*"
  horizontal-radius:
    label: "Horizontal Radius"
  vertical-radius:
    label: "Vertical Radius"
voice-channel-status: "Unable to talk — No players nearby"
proximity-channel-name: "Proximity Channel"
