command-description:
  configure: "Konfigurasikan Skoice."
  link: "Tautkan akun Discord Anda ke Minecraft."
  unlink: "Batalkan tautan akun Discord Anda dari Minecraft."
  invite: "Dapatkan obrolan suara jarak dekat di server Anda."
menu:
  invite-footer: "Ingin Skoice di server Anda? Ketik {invite-discord-command}!"
  review-footer: "Bersenang-senang dengan Skoice? Pertimbangkan untuk [meninggalkan ulasan di SpigotMC]({spigotmc-url})!"
  contributors-footer: "Skoice • carlodrift, Lucas_Cdry dan kontributor"
  configuration:
    title: "Konfigurasi"
  server:
    title: "Server"
    description: "Agar berfungsi dengan baik, bot Anda tidak boleh berada di beberapa server Discord. Pilih server tempat Anda ingin obrolan suara jarak dekat aktif. Bot Anda akan otomatis meninggalkan server lainnya."
    select-menu:
      placeholder: "Silakan pilih server."
  two-factor-authentication:
    title: "Autentikasi Dua Faktor"
    description: "Server Discord Anda mengharuskan akun pemilik bot mengaktifkan autentikasi dua faktor. Aktifkan atau nonaktifkan persyaratan ini di pengaturan server dengan mengikuti jalur ini: `Moderasi › Penyiapan Keamanan › (Izin ›) Wajibkan 2FA untuk tindakan moderator`."
  permissions:
    title: "Izin"
    description: "Agar berfungsi dengan baik, bot Anda harus memiliki izin `Administrator` di server Discord Anda. Untuk melakukannya, berikan bot sebuah peran dengan izin `Administrator`, atau minta {bot-owner-mention} untuk menjalankan {configure-discord-command} guna memperbarui izinnya."
    description-owner: "Agar berfungsi dengan baik, bot Anda harus memiliki izin `Administrator` di server Discord Anda. Klik tombol di bawah untuk memberikannya."
  voice-chat:
    title: "Obrolan Suara"
  range:
    title: "Jangkauan"
    description: "Sesuaikan jangkauan obrolan suara jarak dekat."
    select-menu:
      placeholder: "Silakan pilih jangkauan."
      select-option:
        long-range-mode:
          label: "Mode Jangkauan Jauh"
        short-range-mode:
          label: "Mode Jangkauan Dekat"
        customized:
          label: "Disesuaikan"
        description: "Radius Horizontal: {horizontal-radius} blok — Radius Vertikal: {vertical-radius} blok"
  active-worlds:
    title: "Dunia Aktif"
    description: "Pilih dunia tempat Skoice aktif."
    select-menu:
      placeholder: "Silakan pilih dunia yang diinginkan."
  excluded-players:
    title: "Pemain yang Dikecualikan"
    description: "Pilih jenis pemain yang dikecualikan dari obrolan suara jarak dekat dan apakah mereka masih dapat berkomunikasi satu sama lain."
    excluded-player-types:
      select-menu:
        placeholder: "Silakan pilih jenis pemain yang dikecualikan."
        players-on-death-screen-excluded:
          label: "Pemain di Layar Kematian"
        spectators-excluded:
          label: "Penonton"
    excluded-player-behavior:
      select-menu:
        same-world:
          label: "Selalu Berkomunikasi di Dunia yang Sama"
        in-range:
          label: "Berkomunikasi Saat dalam Jangkauan"
        disabled:
          label: "Jangan Pernah Berkomunikasi"
  teams:
    title: "Tim"
    description: "Pilih sistem yang digunakan Skoice untuk menentukan pemain mana yang termasuk dalam tim yang sama serta perilaku yang berlaku untuk tim. Sistem tim bawaan Minecraft dapat digunakan dengan `/team` atau dengan plugin dan datapack yang mengelolanya. Skoice juga mendukung plugin pihak ketiga seperti [Parties](https://www.spigotmc.org/resources/parties-an-advanced-parties-manager.3709/). Plugin yang sesuai harus terpasang agar penyedia dapat berfungsi, jika tidak, fitur tim akan dinonaktifkan."
    team-provider:
      select-menu:
        select-option:
          vanilla:
            label: "Vanilla"
          parties:
            label: "Parties"
    team-behaviors:
      select-menu:
        placeholder: "Silakan pilih perilaku yang diinginkan."
        team-communication:
          label: "Selalu Izinkan Anggota Tim Berkomunikasi"
        separated-teams:
          label: "Cegah Komunikasi Antartim"
  chaining:
    title: "Perantaian"
    description: "Pilih jarak tambahan yang diizinkan saat pemain membentuk rantai. Perantaian biasanya terjadi ketika seorang pemain berada di antara dua pemain lain yang seharusnya tidak dapat berkomunikasi. Dalam hal ini, jangkauan diperluas agar ketiga pemain dapat saling mendengar."
    select-menu:
      disabled:
        label: "Dinonaktifkan — Tidak ada perantaian yang diizinkan"
      short:
        label: "Pendek — +25% dari jangkauan awal"
      medium:
        label: "Sedang — +50% dari jangkauan awal"
      long:
        label: "Jauh — +100% dari jangkauan awal"
  discord-integration:
    title: "Integrasi Discord"
  voice-channel:
    title: "Kanal Suara"
    description: "Pilih kanal yang harus dimasuki pemain untuk menggunakan obrolan suara jarak dekat. Kanal harus berada dalam sebuah kategori. Perlu diketahui bahwa pemain akan otomatis dibisukan di kanal ini."
    select-menu:
      placeholder: "Silakan pilih kanal suara."
      select-option:
        new-voice-channel:
          label: "Kanal Suara Baru"
          description: "Skoice akan otomatis menyiapkan kanal suara."
  text-chat:
    title: "Obrolan Teks"
    description: "Pilih apakah pemain dapat mengirim pesan teks di kanal jarak dekat atau tidak."
  channel-visibility:
    title: "Visibilitas Kanal"
    description: "Aktifkan atau nonaktifkan visibilitas kanal sementara yang dibuat oleh Skoice."
  in-game-messages:
    title: "Pesan dalam Game"
  login-notification:
    title: "Notifikasi Masuk"
    description: "Aktifkan atau nonaktifkan pesan yang dikirim ke pemain yang belum menautkan akun mereka saat mereka masuk ke server Minecraft Anda."
    select-menu:
      always-remind:
        label: "Selalu Ingatkan"
      remind-once:
        label: "Ingatkan Sekali"
      never-remind:
        label: "Jangan Pernah Ingatkan"
  action-bar-alerts:
    title: "Peringatan Bilah Aksi"
    description: "Aktifkan atau nonaktifkan peringatan yang dikirim ke pemain di server Minecraft Anda terkait obrolan suara jarak dekat."
    select-menu:
      placeholder: "Silakan pilih peringatan yang diinginkan."
      linking-suggestion:
        label: "\"Pemain di dekat Anda menggunakan Skoice. Ketik \"/skoice link\" untuk bergabung!\""
      connecting-alert:
        label: "\"Anda berada di dekat pemain lain. Sapa mereka!\""
      disconnecting-alert:
        label: "\"Anda menjauh dari pemain di dekat Anda.\""
      muted-alert:
        label: "\"Anda dibisukan.\""
      deafened-alert:
        label: "\"Suara Anda dimatikan.\""
  invite-link:
    title: "Tautan Undangan"
    description: "Aktifkan atau nonaktifkan apakah nama server Discord muncul sebagai tautan undangan yang dapat diklik di pesan obrolan Minecraft. Skoice membuat undangan permanen di kanal suara jarak dekat yang telah Anda konfigurasikan. Nonaktifkan ini jika Anda tidak menginginkannya."
  tooltips:
    title: "Tooltip"
    description: "Aktifkan atau nonaktifkan pesan interaktif di server Minecraft Anda. Anda mungkin ingin menonaktifkan pengaturan ini jika server Anda berjalan di Bedrock Edition atau jika tooltip dinonaktifkan di pengaturan Minecraft. Hanya operator yang dapat menerima pesan interaktif."
  advanced-settings:
    title: "Pengaturan Lanjutan"
  link-synchronization:
    title: "Sinkronisasi Tautan"
    description: "Aktifkan atau nonaktifkan sinkronisasi plugin eksternal dengan Skoice. Ketika pemain menautkan akun mereka melalui Skoice atau plugin yang dipilih, sinkronisasi waktu nyata terjadi di kedua sisi. Memperbarui opsi ini mengharuskan Anda memulai ulang server Minecraft agar berlaku."
    select-menu:
      placeholder: "Silakan pilih plugin yang diinginkan."
  release-channel:
    title: "Kanal Rilis"
    description: "Pilih versi Skoice yang ingin Anda gunakan."
  language:
    title: "Bahasa"
    description: "Pilih bahasa yang digunakan untuk menampilkan pesan."
  skoice-proximity-voice-chat:
    title: "Skoice: Obrolan Suara Jarak Dekat"
  linking-process:
    title: "Proses Penautan"
  error:
    title: "Kesalahan"
field:
  configuration-complete:
    title: "Konfigurasi Selesai"
    description: "Skoice sekarang telah dikonfigurasi. Ketik {link-discord-command} untuk menautkan akun Discord Anda ke Minecraft. Pemain harus menautkan akun mereka untuk menggunakan obrolan suara jarak dekat."
  notified-players-cleared:
    title: "Pemain yang Diberi Tahu Dihapus"
    description: "Anda telah menghapus pemain yang diberi tahu. Pemain yang sudah menerima pengingat untuk menautkan akun mereka sekarang akan diberi tahu lagi."
  incomplete-configuration:
    title: "Konfigurasi Belum Lengkap"
    description: "Skoice tidak dikonfigurasi dengan benar. Silakan hubungi administrator server."
  incomplete-configuration-server-manager:
    title: "Konfigurasi Belum Lengkap"
    description: "Ketik {configure-discord-command} atau klik tombol di bawah untuk menyelesaikan konfigurasi dan menggunakan Skoice."
  incomplete-configuration-alternative-server-manager:
    title: "Konfigurasi Belum Lengkap"
    description: "Anda telah menghapus kanal suara utama atau kategorinya. Ketik {configure-discord-command} untuk menyelesaikan konfigurasi dan menggunakan Skoice."
  download:
    title: "Unduh"
    description: "[Dapatkan plugin]({spigotmc-url}) dan pasang di server Minecraft Anda."
  donating:
    title: "Donasi"
    description: "Skoice adalah perangkat lunak gratis. Jika Anda menyukainya, Anda dapat membantu kami dengan [berdonasi]({open-collective-url})."
  contributing:
    title: "Kontribusi"
    description: "Tertarik membantu kami membentuk masa depan Skoice? [Berkontribusi di halaman GitHub kami]({github-url})!"
  long-range-mode:
    title: "Mode Jangkauan Jauh"
    description: "Pilih mode ini jika Anda berencana memainkan mode permainan dunia terbuka."
  short-range-mode:
    title: "Mode Jangkauan Dekat"
    description: "Pilih mode ini jika Anda berencana memainkan mode permainan yang hanya membutuhkan area terbatas."
  customized:
    title: "Disesuaikan"
    description: "Atur jarak sesuai preferensi pribadi Anda."
  production-channel:
    title: "Kanal Produksi"
    description: "Pilih kanal ini untuk menggunakan versi publik. Kanal ini lebih mungkin menawarkan pengalaman yang stabil."
  beta-channel:
    title: "Kanal Beta"
    description: "Pilih kanal ini untuk menemukan dan menguji fitur terbaru kami yang belum dirilis ke publik. Versi ini mungkin mengandung bug."
  verification-code:
    title: "Kode Verifikasi"
    description: "Ketik `{link-minecraft-command} {code}` di dalam game untuk menyelesaikan proses."
  account-linked:
    title: "Akun Tertaut"
    description: "Akun Discord Anda telah ditautkan ke Minecraft. Bergabunglah ke kanal suara {voice-channel} untuk menggunakan obrolan suara jarak dekat."
  account-unlinked:
    title: "Tautan Akun Dibatalkan"
    description: "Tautan akun Discord Anda dari Minecraft telah dibatalkan."
  account-not-linked:
    title: "Akun Tidak Tertaut"
    description: "Akun Discord Anda tidak tertaut ke Minecraft. Ketik {link-discord-command} untuk menautkannya dan menggunakan obrolan suara jarak dekat."
  account-already-linked:
    title: "Akun Sudah Tertaut"
    description: "Akun Discord Anda sudah tertaut ke akun Minecraft `{minecraft-username}`. Ketik {unlink-discord-command} untuk membatalkan tautannya."
  restricted-command:
    title: "Perintah Dibatasi"
    description: "Perintah ini harus dijalankan di server Discord."
  access-denied:
    title: "Akses Ditolak"
    description: "Anda tidak memiliki izin yang diperlukan untuk menjalankan perintah ini."
  illegal-value:
    title: "Nilai Tidak Sah"
    description: "Nilai harus berupa bilangan bulat lebih besar dari 0."
  proximity-channel-deleted:
    title: "Kanal Jarak Dekat Dihapus"
    description: "Anda telah menghapus kanal yang digunakan oleh obrolan suara jarak dekat. Kanal-kanal ini otomatis dihapus ketika tidak lagi diperlukan. Anda tidak boleh melakukannya secara manual."
  invite-link-revoked:
    title: "Tautan Undangan Dicabut"
    description: "Anda telah mencabut tautan undangan yang digunakan Skoice untuk memungkinkan pemain Minecraft bergabung ke server Discord Anda. Skoice akan membuatnya kembali saat diperlukan. Untuk menghentikan ini, nonaktifkan pengaturan `Tautan Undangan` di `Konfigurasi › Pesan dalam Game` dengan menjalankan {configure-discord-command}."
  shared-bot:
    title: "Bot Bersama"
    description: "Sepertinya bot Anda menjalankan beberapa program. Namun, bot harus didedikasikan untuk Skoice agar berfungsi dengan baik. Anda dapat membuat yang baru dengan [mengikuti petunjuk ini]({creation-guide-url}). Setelah mendapatkan tokennya, ketik `{token-minecraft-command}` diikuti dengan token tersebut di server Minecraft Anda. Jika bot Anda tidak menjalankan beberapa program, silakan minta bantuan di server Discord kami dengan menekan tombol di bawah."
button-label:
  configure-now: "Konfigurasikan Sekarang"
  support-server: "Server Dukungan"
  clear-notified-players: "Hapus Pemain yang Diberi Tahu"
  refresh: "Muat Ulang"
  update-permissions: "Perbarui Izin"
  explore-more-settings: "Jelajahi Pengaturan Lainnya"
select-option:
  default:
    description: "Opsi ini dipilih secara default."
  undesirable:
    description: "Opsi ini dapat menyebabkan perilaku yang tidak diinginkan."
  enabled:
    label: "Diaktifkan"
  disabled:
    label: "Dinonaktifkan"
  too-many-options:
    label: "Terlalu Banyak Opsi"
    description: "Skoice tidak dapat memuat lebih banyak opsi."
text-input:
  category-name:
    label: "Nama Kategori"
    default-value: "Skoice"
  voice-channel-name:
    label: "Nama Kanal Suara"
    default-value: "Proximity Voice Chat"
  horizontal-radius:
    label: "Radius Horizontal"
  vertical-radius:
    label: "Radius Vertikal"
voice-channel-status: "Tidak dapat berbicara — Tidak ada pemain di dekat"
proximity-channel-name: "Kanal Jarak Dekat"
