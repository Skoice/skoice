    shared-bot: "Zdá se, že tvůj bot běží ve více programech. Musí však být určen výhradně pro Skoice, aby fungoval správně. Nový můžeš vytvořit podle pokynů na této stránce: {creation-guide-url}. Jakmile získáš jeho token, napiš \"{token-minecraft-command}\" následované tokenem."
    commands-not-registered: "Skoice nemohl zaregistrovat své Discord příkazy, protože byl dosažen limit příkazů aplikace. Odeber nepoužívané boty ze svého Discord serveru pro uvolnění příkazů a poté restartuj svůj Minecraft server."
