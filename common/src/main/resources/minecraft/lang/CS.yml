    two-factor-authentication: "Vyžadováno dvoufaktorové ověření. Zapni dvoufaktorové ověření na účtu majitele bota nebo vypni \"Vyžadovat 2FA pro moderátorské akce\" v nastavení serveru."
    no-voice-channel: "Hlasový kanál není nastaven. Napiš \"{configure-discord-command}\" na svém Discord serveru pro nastavení Skoice."
