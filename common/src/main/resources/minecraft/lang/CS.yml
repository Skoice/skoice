logger:
  info:
    plugin-enabled: "Plugin povolen."
    plugin-disabled: "Plugin zakázán."
    plugin-updated: "Skoice byl aktualizován na nejnovější verzi. Prosím restartujte váš Minecraft server pro použití změn."
    skoice-3: "Nyní používáš Skoice 3. Aby tvůj bot fungoval správně, postupuj podle našeho průvodce migrací zde: {migration-guide-url}."
    configuration-complete: "Skoice je nyní nakonfigurován. Napiš \"{link-discord-command}\" na svém Discord serveru pro propojení svého Discord účtu s Minecraftem. Hráči musí propojit své účty, aby mohli používat proximity voice chat."
  warning:
    outdated-version: "Používáš zastaralou verzi ({current-version}). Stáhni si nejnovější verzi ({latest-version}) zde: {spigotmc-url}."
    no-token: "Token není nastaven. Připojte se k Minecraft serveru pro nastavení Skoice."
