logger:
  info:
    plugin-enabled: "Plugin aktivert."
    plugin-disabled: "Plugin deaktivert."
    plugin-updated: "Skoice har blitt oppdatert til nyeste versjon. Vennligst restart din Minecraft-server for å aktivere endringene."
    skoice-3: "Du bruker nå Skoice 3. For å få boten din til å fungere skikkelig, følg migreringsguiden vår her: {migration-guide-url}."
    configuration-complete: "Skoice er nå konfigurert. Skriv \"{link-discord-command}\" på din Discord server for å linke din Discord bruker til Minecraft. Spillere må linke brukerene sine for å kunne bruke proximity voice chatten."
  warning:
    outdated-version: "Du bruker en utdatert versjon ({current-version}). Last ned den nyeste versjonen ({latest-version}) her: {spigotmc-url}."
    no-token: "Din token er ikke satt. Logg på din Minecraft server for å sette opp Skoice."
    multiple-guilds: "Din bot er på flere Discord servere. Skriv \"{configure-discord-command}\" på din Discord server for å velge en."
    two-factor-authentication: "Tofaktorautentisering kreves. Aktiver tofaktorautentisering på kontoen til bot-eieren, eller deaktiver \"Krev 2FA for moderatorhandlinger\" i serverinnstillingene."
    no-voice-channel: "Du har ikke spesifisert en voice channel. Skriv \"{configure-discord-command}\" på din Discord server for å sette opp Skoice."
    no-radius: "Radius er ikke satt. Skriv \"{configure-discord-command}\" på din Discord server for å sette opp Skoice."
    missing-permission: "Du har ikke gitt boten din tillatelsen \"Administrator\" på Discord-serveren din. Åpne denne lenken for å legge den til: {bot-invite-url}."
    invalid-bot: "Boten din er ikke riktig konfigurert. Bli med på Minecraft-serveren din for å opprette en ny."
    shared-bot: "Det ser ut til at boten din kjører flere programmer. Den må imidlertid være dedikert til Skoice for å fungere skikkelig. Du kan opprette en ny ved å følge instruksjonene på denne siden: {creation-guide-url}. Når du har hentet tokenet, skriv \"{token-minecraft-command}\" etterfulgt av tokenet."
    commands-not-registered: "Skoice kunne ikke registrere Discord-kommandoene sine fordi grensen for applikasjonskommandoer er nådd. Fjern ubrukte bots fra Discord-serveren din for å frigjøre kommandoer, og start deretter Minecraft-serveren din på nytt."
