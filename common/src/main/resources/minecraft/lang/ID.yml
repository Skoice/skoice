logger:
  info:
    plugin-enabled: "Plugin diaktifkan."
    plugin-disabled: "Plugin dinonaktifkan."
    plugin-updated: "Skoice telah diperbarui ke versi terbaru. Silakan mulai ulang server Minecraft Anda untuk menerapkan perubahan."
    skoice-3: "Anda sekarang menggunakan Skoice 3. Agar bot Anda berfungsi dengan baik, ikuti panduan migrasi kami di sini: {migration-guide-url}."
    configuration-complete: "Skoice sekarang telah dikonfigurasi. Ketik \"{link-discord-command}\" di server Discord Anda untuk menautkan akun Discord Anda ke Minecraft. Pemain harus menautkan akun mereka untuk menggunakan obrolan suara jarak dekat."
  warning:
    outdated-version: "Anda menggunakan versi yang sudah usang ({current-version}). Unduh versi terbaru ({latest-version}) di sini: {spigotmc-url}."
    no-token: "Token belum diatur. Bergabunglah ke server Minecraft Anda untuk menyiapkan Skoice."
    multiple-guilds: "Bot Anda berada di beberapa server Discord. Ketik \"{configure-discord-command}\" di server Discord Anda untuk memilih salah satu."
    two-factor-authentication: "Autentikasi dua faktor diperlukan. Aktifkan autentikasi dua faktor pada akun pemilik bot atau nonaktifkan \"Wajibkan 2FA untuk tindakan moderator\" di pengaturan server."
    no-voice-channel: "Kanal suara belum diatur. Ketik \"{configure-discord-command}\" di server Discord Anda untuk menyiapkan Skoice."
    no-radius: "Radius belum diatur. Ketik \"{configure-discord-command}\" di server Discord Anda untuk menyiapkan Skoice."
    missing-permission: "Anda belum memberi bot Anda izin \"Administrator\" di server Discord Anda. Buka tautan ini untuk menambahkannya: {bot-invite-url}."
    invalid-bot: "Bot Anda tidak dikonfigurasi dengan benar. Bergabunglah ke server Minecraft Anda untuk membuat yang baru."
    shared-bot: "Sepertinya bot Anda menjalankan beberapa program. Namun, bot harus didedikasikan untuk Skoice agar berfungsi dengan baik. Anda dapat membuat yang baru dengan mengikuti petunjuk di halaman ini: {creation-guide-url}. Setelah mendapatkan tokennya, ketik \"{token-minecraft-command}\" diikuti dengan token tersebut."
    commands-not-registered: "Skoice tidak dapat mendaftarkan perintah Discord-nya karena batas perintah aplikasi telah tercapai. Keluarkan bot yang tidak digunakan dari server Discord Anda untuk mengosongkan perintah, lalu mulai ulang server Minecraft Anda."
