logger:
  info:
    plugin-enabled: "Plugin diaktifkan."
    plugin-disabled: "Plugin dinonaktifkan."
    plugin-updated: "Skoice telah diperbarui ke versi terbaru. Silakan restart server Minecraft Anda untuk menerapkan perubahan."
    skoice-3: "Anda sekarang menggunakan Skoice 3. Untuk membuat bot Anda bekerja dengan benar, ikuti panduan migrasi kami di sini: {migration-guide-url}."
    configuration-complete: "Skoice sekarang dikonfigurasi. Ketik \"{link-discord-command}\" di server Discord Anda untuk menautkan akun Discord Anda ke Minecraft. Pemain harus menautkan akun mereka untuk menggunakan proximity voice chat."
  warning:
    outdated-version: "Anda menggunakan versi usang ({current-version}). Unduh versi terbaru ({latest-version}) di sini: {spigotmc-url}."
    no-token: "Token belum diset. Bergabunglah ke server Minecraft Anda untuk mengatur Skoice."
    multiple-guilds: "Bot Anda berada di beberapa server Discord. Ketik \"{configure-discord-command}\" di server Discord Anda untuk memilih satu."
    two-factor-authentication: "Dua faktor autentikasi diperlukan. Aktifkan autentikasi dua faktor pada akun pemilik bot atau nonaktifkan \"Require 2FA for moderator actions\" di pengaturan server."
    no-voice-channel: "Saluran suara belum diset. Ketik \"{configure-discord-command}\" di server Discord Anda untuk mengatur Skoice."
    no-radius: "Radius belum diset. Ketik \"{configure-discord-command}\" di server Discord Anda untuk mengatur Skoice."
    missing-permission: "Anda belum memberikan izin \"Administrator\" kepada bot di server Discord Anda. Buka tautan ini untuk menambahkannya: {bot-invite-url}."
    invalid-bot: "Bot Anda tidak dikonfigurasi dengan benar. Bergabunglah ke server Minecraft Anda untuk membuat yang baru."
    shared-bot: "Sepertinya bot Anda menjalankan beberapa program. Namun, bot harus didedikasikan untuk Skoice agar berfungsi dengan baik. Anda dapat membuat yang baru dengan mengikuti instruksi di halaman ini: {creation-guide-url}. Setelah Anda mendapatkan tokennya, ketik \"{token-minecraft-command}\" diikuti token tersebut."
    commands-not-registered: "Skoice tidak dapat mendaftarkan perintah Discord karena batas perintah aplikasi telah tercapai. Keluarkan bot yang tidak digunakan dari server Discord Anda untuk membuka slot, lalu restart server Minecraft Anda."
