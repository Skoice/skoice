logger:
  info:
    plugin-enabled: "Plugin abilitato."
    plugin-disabled: "Plugin disabilitato."
    plugin-updated: "Skoice è stato aggiornato all'ultima versione. Riavvia il tuo server Minecraft per applicare le modifiche."
    skoice-3: "Ora stai usando Skoice 3. Per far funzionare correttamente il tuo bot, segui la nostra guida alla migrazione qui: {migration-guide-url}."
    configuration-complete: "Skoice è ora configurato. Digita \"{link-discord-command}\" sul tuo server Discord per collegare il tuo account Discord a Minecraft. I giocatori devono collegare i loro account per utilizzare la chat vocale di prossimità."
  warning:
    outdated-version: "Stai usando una versione obsoleta ({current-version}). Scarica l'ultima versione ({latest-version}) qui: {spigotmc-url}."
    no-token: "Token non impostato. Unisciti al tuo server Minecraft per configurare Skoice."
    multiple-guilds: "Il tuo bot è su più server Discord. Digita \"{configure-discord-command}\" sul tuo server Discord per sceglierne uno."
    two-factor-authentication: "Autenticazione a due fattori richiesta. Attiva l'autenticazione a due fattori sull'account del proprietario del bot o disattiva \"Richiedi 2FA per le azioni dei moderatori\" nelle impostazioni del server."
    no-voice-channel: "Canale vocale non impostato. Digita \"{configure-discord-command}\" sul tuo server Discord per configurare Skoice."
    no-radius: "Raggio non impostato. Digita \"{configure-discord-command}\" sul tuo server Discord per configurare Skoice."
    missing-permission: "Non hai concesso al tuo bot l'autorizzazione \"Administrator\" sul tuo server Discord. Apri questo link per aggiungerla: {bot-invite-url}."
    invalid-bot: "Il tuo bot non è configurato correttamente. Unisciti al tuo server Minecraft per crearne uno nuovo."
    shared-bot: "Sembra che il tuo bot stia eseguendo più programmi. Tuttavia, deve essere dedicato esclusivamente a Skoice per funzionare correttamente. Puoi crearne uno nuovo seguendo le istruzioni in questa pagina: {creation-guide-url}. Una volta ottenuto il suo token, digita \"{token-minecraft-command}\" seguito dal token."
    commands-not-registered: "Skoice non è riuscito a registrare i suoi comandi Discord perché è stato raggiunto il limite di comandi dell'applicazione. Espelli i bot inutilizzati dal tuo server Discord per liberare comandi, poi riavvia il tuo server Minecraft."
