logger:
  info:
    plugin-enabled: "Plugin er aktiveret."
    plugin-disabled: "Plugin er deaktiveret."
    plugin-updated: "Skoice er blevet opdateret til den seneste version. Genstart venligst din Minecraft server for at anvende ændringer."
    skoice-3: "Du bruger nu Skoice 3. For at få din bot til at fungere korrekt, følg vores migreringsguide her: {migration-guide-url}."
    configuration-complete: "Skoice er nu konfigureret. Skriv \"{link-discord-command}\" på din Discord server for at linke din Discord-konto til Minecraft. Spillere skal linke deres konti for at bruge nærhedsbaseret stemmechat."
  warning:
    outdated-version: "Du bruger en forældet version ({current-version}). Download den seneste version ({latest-version}) her: {spigotmc-url}."
    no-token: "Token ikke sat. Tilslut dig din Minecraft server for at opsætte Skoice."
    multiple-guilds: "Din bot er på flere Discord servere. Skriv \"{configure-discord-command}\" på din Discord server for at vælge en."
    two-factor-authentication: "To-faktor-godkendelse påkrævet. Aktiver to-faktor-godkendelse på bot-ejerens konto, eller deaktiver \"Kræv 2FA for moderatorhandlinger\" i serverindstillingerne."
    no-voice-channel: "Stemmekanal ikke sat. Skriv \"{configure-discord-command}\" på din Discord server for at opsætte Skoice."
    no-radius: "Radius ikke sat. Skriv \"{configure-discord-command}\" på din Discord server for at opsætte Skoice."
    missing-permission: "Du har ikke givet din bot tilladelsen \"Administrator\" på din Discord-server. Åbn dette link for at tilføje den: {bot-invite-url}."
    invalid-bot: "Din bot er ikke konfigureret korrekt. Tilslut dig din Minecraft-server for at oprette en ny."
    shared-bot: "Det ser ud til, at din bot kører flere programmer. Den skal dog være dedikeret til Skoice for at fungere korrekt. Du kan oprette en ny ved at følge instruktionerne på denne side: {creation-guide-url}. Når du har hentet dens token, skal du skrive \"{token-minecraft-command}\" efterfulgt af token."
    commands-not-registered: "Skoice kunne ikke registrere sine Discord-kommandoer, fordi grænsen for applikationskommandoer er nået. Fjern ubrugte bots fra din Discord-server for at frigøre kommandoer, og genstart derefter din Minecraft-server."
